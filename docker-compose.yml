services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AVATAR_ID: ${AVATAR_ID:-stock-avatar-placeholder}
      VOICE_ID: ${VOICE_ID}
      RENDER_BASE_URL: ${RENDER_BASE_URL:-http://renderer:8080}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_started

  # Local stand-in for HeyGen's /v3/videos API (free, no lip sync).
  # Swap to HeyGen later: set RENDER_BASE_URL=https://api.heygen.com
  renderer:
    build: ./services/renderer
    restart: unless-stopped
    environment:
      RENDERER_API_KEY: ${RENDERER_API_KEY}
    ports:
      - "127.0.0.1:8088:8080"   # only for curl tests from your Mac
    volumes:
      - ./files:/files:ro
      - ./assets/avatars:/avatars:ro
      - renders:/renders

volumes:
  pg_data:
  n8n_data:
  renders:
